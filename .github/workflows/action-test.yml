name: action-test

# Self-test of the composite action (action.yml): uses the repo itself as
# the action under test against the example suite, on Linux and Windows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  use-action-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run verax via composite action
        uses: ./
        with:
          mode: test
          files: examples/mcp-fixture.suite.yaml
          verbose: 'true'
          junit: verax-junit.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verax-reports-${{ matrix.os }}
          path: verax-junit.xml
          if-no-files-found: ignore

  use-action-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the clean fixture via composite action
        uses: ./
        with:
          mode: scan
          target: testfixtures/scanclean
          sarif: verax.sarif

      - name: Scan the Rust fixture via composite action
        uses: ./
        with:
          mode: scan
          target: testfixtures/scanrust
          sarif: rust.sarif
        # fixture findings are the point (Rust rule pack e2e): scan exits 1
        # on any finding by default, and this fixture is built to have them
        continue-on-error: true

      - name: Rust rules actually fired
        run: |
          grep -q "VX-SEC-014" rust.sarif
          grep -q "VX-QUA-107" rust.sarif
          grep -q "VX-SEC-003" rust.sarif
          echo "rust rule pack verified in SARIF"

      - name: Scan a real crate via composite action
        uses: ./
        with:
          mode: scan
          target: crate:tinyjson@2.5.1
        # third-party findings are evidence, not our gate (same policy as
        # the npm real-package scan)
        continue-on-error: true

      - name: Scan a real pypi package via composite action
        uses: ./
        with:
          mode: scan
          target: pypi:mcp-server-fetch@2026.11.4
        # same evidence-not-gate policy
        continue-on-error: true

      - name: Scan this repo via the github target (must stay clean)
        uses: ./
        with:
          mode: scan
          target: gh:Hai-Wenxiang/mcp-verax@main
        # self-scan through the full gh: pipeline (latest-release/default-
        # branch resolve → codeload → pax-aware extract); verax must scan
        # its own published archive clean — no gate flags, exit 0 required

      - name: Test the filesystem-safe template via composite action
        uses: ./
        with:
          mode: test
          files: templates/filesystem-safe/tests/server.suite.yaml

      - name: Test the csv-query template via composite action
        uses: ./
        with:
          mode: test
          files: templates/csv-query/tests/server.suite.yaml

      - name: Test the notes-store template via composite action
        uses: ./
        with:
          mode: test
          files: templates/notes-store/tests/server.suite.yaml

      - name: Test the rest-api-wrap template via composite action
        uses: ./
        with:
          mode: test
          files: templates/rest-api-wrap/tests/server.suite.yaml

      - name: Test the web-fetch-md template via composite action
        uses: ./
        with:
          mode: test
          files: templates/web-fetch-md/tests/server.suite.yaml

      - name: Test the db-readonly template via composite action
        uses: ./
        with:
          mode: test
          files: templates/db-readonly/tests/server.suite.yaml

      - name: Scan a real published package via composite action
        uses: ./
        with:
          mode: scan
          target: "@modelcontextprotocol/server-memory"
          sarif: real.sarif
        # third-party findings are evidence, not our gate: keep the pipeline
        # honest without failing on someone else's CVEs
        continue-on-error: true
