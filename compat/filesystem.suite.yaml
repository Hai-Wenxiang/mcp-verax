# Verax compatibility suite — official @modelcontextprotocol/server-filesystem
# Scoped to the compat/ directory itself ("." is the cwd when verax runs here).
suite: official-filesystem
target:
  command: npx -y @modelcontextprotocol/server-filesystem .
  timeout_startup_ms: 180000
case:
  - name: tool catalogue
    expect:
      tools.list.includes: [read_file, list_directory, search_files]
  # NOTE: no tool calls and no fuzz in this suite — under F-2 (see FINDINGS.md)
  # the server hangs non-deterministically on rapid sequential calls on
  # Windows; later runs caught even the fuzz campaign and the path-escape
  # probe that had passed earlier. Catalogue + shutdown checks stay stable.
leak:
  process_exit: true
